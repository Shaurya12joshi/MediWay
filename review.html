<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediWay — Write a Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/input.css">
      <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon.png">

</head>
<body class="font-sans text-text min-h-screen bg-bg antialiased m-0 p-0">

<nav class="sticky top-0 z-[200] bg-[#F5F5F4] backdrop-blur-[12px] border-b border-border h-[60px] flex items-center px-[24px]">
  <div class="max-w-[640px] w-full mx-auto flex items-center gap-[12px]">
    <div class="flex items-center gap-[9px]">
      <div class="w-[34px] h-[34px] rounded-[10px] bg-red flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </div>
      <span class="font-custom text-[29px] font-bold hover:text-[#D6453A] hover:cu  text-text">MediWay</span>
    </div>
    <div style="flex:1"></div>
    <a id="backLink" href="searchResult.html" class="flex items-center gap-[5px] text-[13px] text-faint no-underline hover:text-text">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to profile
    </a>
    <button id="signOutBtn" class="text-slate-600 hover:text-[#D6453A] text-sm font-semibold">Sign Out</button>
  </div>
</nav>

<div class="max-w-[640px] mx-auto px-[24px] py-[36px]" id="pageBody">
  <div class="text-center py-[64px] text-faint text-[14px]" id="loadingState">
    <div class="w-[32px] h-[32px] border-[2px] border-border border-t-red rounded-full animate-spin mx-auto mb-[12px]"></div>
    Loading…
  </div>
</div>

<div class="fixed bottom-[24px] left-1/2 -translate-x-1/2 z-[999] bg-text text-white text-[13px] py-[10px] px-[20px] rounded-[10px] opacity-0 pointer-events-none transition-all duration-300" id="toast"></div>

<footer class="bg-[#F2F1ED] border-t border-slate-200 px-6 py-5 md:px-12 lg:px-16">
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4">

    <div class="flex items-center gap-3">
      <div class="bg-[#D6453A] w-8 h-8 rounded-lg flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white">
          <path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </div>    
      <a href="" class="font-bold text-base hover:text-[#D6453A] font-custom lg:text-xl">MediWay</a>
      <span class="hidden sm:block text-slate-300 text-sm">|</span>
      <span class="hidden sm:block text-slate-500 text-sm">Healthcare discovery for travelers in India</span>
    </div>

    <div class="flex items-center gap-6">
      <a href="#" class="text-slate-500 text-sm hover:text-slate-900 transition-colors">Privacy</a>
      <a href="#" class="text-slate-500 text-sm hover:text-slate-900 transition-colors">Terms</a>
      <a href="mailto:shaurya12joshi@gmail.com" class="text-slate-500 text-sm hover:text-slate-900 transition-colors">Contact</a>
      <a href="https://github.com/Shaurya12joshi/MEDROUTE" class="text-slate-500 text-sm hover:text-slate-900 transition-colors">GitHub</a>
    </div>

  </div>
</footer>

<script type="module">
import { supabase } from './js/supabase.js';

const params = new URLSearchParams(location.search);
const docId = params.get('id');

const STOOD_OUT_OPTIONS = [
  'Bedside manner','Short wait time','Accurate diagnosis','Clear explanation',
  'Friendly staff','Clean facility','Affordable','Followed up after visit',
  'Walk-in friendly','On time'
];
const IMPROVE_OPTIONS = [
  'Wait time','Communication','Front desk experience','Billing clarity',
  'Appointment scheduling','Cleanliness','Parking / access','Follow-up care'
];

let selectedRating = 0;
let stoodOut = new Set();
let couldImprove = new Set();
let recommend = null; 

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0','pointer-events-none');
  t.classList.add('opacity-100');
  setTimeout(()=>{ t.classList.add('opacity-0','pointer-events-none'); t.classList.remove('opacity-100'); }, 2500);
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchDoctor(id){
  const { data, error } = await supabase.from('doctors').select('id,name,hospital,specialty').eq('id', id).single();
  if (error) { console.error(error); return null; }
  return data;
}

function chipRow(options, className){
  return options.map(o => `<button type="button" data-val="${escapeHtml(o)}" class="${className} text-[13px] font-medium py-[9px] px-[15px] rounded-[100px] border-[1.5px] border-border bg-white text-muted cursor-pointer transition-all font-sans">${escapeHtml(o)}</button>`).join('');
}

function render(doctor){
  document.getElementById('backLink').href = `profile.html?id=${doctor.id}`;
  document.getElementById('pageBody').innerHTML = `
    <div class="mb-[24px]">
      <h1 class="font-serif text-[26px] text-text leading-[1.15]">Rate your visit</h1>
      <p class="text-[13px] text-faint mt-[4px]">with <strong class="text-text">${escapeHtml(doctor.name)}</strong> · takes about 20 seconds</p>
    </div>

    <form id="reviewForm" class="bg-white border border-border rounded-[18px] p-[26px] flex flex-col gap-[26px]">

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[12px]">Overall, how was it?</label>
        <div class="flex gap-[8px]" id="starPicker">
          ${[1,2,3,4,5].map(n => `<button type="button" data-val="${n}" class="star-btn text-[38px] leading-none cursor-pointer bg-transparent border-none p-0" style="color:#D1D5DB">★</button>`).join('')}
        </div>
        <p class="text-[12px] text-red mt-[8px] hidden" id="ratingError">Please select a star rating.</p>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[3px]">What stood out?</label>
        <p class="text-[12px] text-faint mb-[12px]">Tap all that apply — optional</p>
        <div class="flex flex-wrap gap-[8px]" id="stoodOutPicker">${chipRow(STOOD_OUT_OPTIONS,'stood-btn')}</div>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[3px]">What could be improved?</label>
        <p class="text-[12px] text-faint mb-[12px]">Tap all that apply — optional</p>
        <div class="flex flex-wrap gap-[8px]" id="improvePicker">${chipRow(IMPROVE_OPTIONS,'improve-btn')}</div>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[12px]">Would you recommend this doctor?</label>
        <div class="grid grid-cols-2 gap-[10px]">
          <button type="button" id="recYesBtn" class="rec-btn flex items-center justify-center gap-[8px] py-[13px] rounded-[12px] border-[1.5px] border-border bg-white text-muted text-[14px] font-semibold cursor-pointer transition-all font-sans">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
            Yes
          </button>
          <button type="button" id="recNoBtn" class="rec-btn flex items-center justify-center gap-[8px] py-[13px] rounded-[12px] border-[1.5px] border-border bg-white text-muted text-[14px] font-semibold cursor-pointer transition-all font-sans">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:scaleY(-1)"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
            No
          </button>
        </div>
        <p class="text-[12px] text-red mt-[8px] hidden" id="recError">Please let us know if you'd recommend them.</p>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[8px]">Your name</label>
        <input id="authorInput" type="text" placeholder="e.g. Priya S." required
          class="w-full border-[1.5px] border-border rounded-[10px] px-[14px] py-[10px] text-[14px] outline-none focus:border-red font-sans"/>
      </div>

      <div>
        <label class="block text-[13px] font-semibold text-text mb-[3px]">Proof of visit</label>
        <p class="text-[12px] text-faint mb-[12px]">Upload a photo of a prescription or bill to get a "Verified visit" badge on your review — optional, reviewed by our team, never shown publicly.</p>
        <label for="proofInput" class="flex flex-col items-center justify-center gap-[8px] border-[1.5px] border-dashed border-border rounded-[12px] py-[24px] cursor-pointer hover:border-red transition-all" id="proofDropzone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="text-[13px] text-muted font-medium" id="proofLabel">Tap to upload photo</span>
        </label>
        <input id="proofInput" type="file" accept="image/*" class="hidden"/>
        <div class="hidden mt-[10px]" id="proofPreviewWrap">
          <img id="proofPreview" class="rounded-[10px] max-h-[160px] object-cover border border-border"/>
          <button type="button" id="proofRemoveBtn" class="text-[12px] text-red font-medium mt-[6px] bg-transparent border-none cursor-pointer p-0">Remove photo</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="bg-red hover:bg-red-dark text-white border-none py-[14px] rounded-[12px] text-[14px] font-semibold cursor-pointer transition-colors font-sans">
        Submit review
      </button>
      <p class="text-[12px] text-red text-center hidden" id="submitError"></p>
    </form>
  `;

  const starBtns = document.querySelectorAll('.star-btn');
  starBtns.forEach(b => {
    b.addEventListener('click', () => {
      selectedRating = +b.dataset.val;
      starBtns.forEach(x => x.style.color = (+x.dataset.val <= selectedRating) ? '#F59E0B' : '#D1D5DB');
      document.getElementById('ratingError').classList.add('hidden');
    });
    b.addEventListener('mouseenter', () => {
      starBtns.forEach(x => x.style.color = (+x.dataset.val <= +b.dataset.val) ? '#F59E0B' : '#D1D5DB');
    });
  });
  document.getElementById('starPicker').addEventListener('mouseleave', () => {
    starBtns.forEach(x => x.style.color = (+x.dataset.val <= selectedRating) ? '#F59E0B' : '#D1D5DB');
  });

  document.querySelectorAll('.stood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      if (stoodOut.has(val)) {
        stoodOut.delete(val);
        btn.className = 'stood-btn text-[13px] font-medium py-[9px] px-[15px] rounded-[100px] border-[1.5px] border-border bg-white text-muted cursor-pointer transition-all font-sans';
      } else {
        stoodOut.add(val);
        btn.className = 'stood-btn text-[13px] font-semibold py-[9px] px-[15px] rounded-[100px] border-[1.5px] border-[#BBF7D0] bg-[#F0FDF4] text-[#16A34A] cursor-pointer transition-all font-sans';
      }
    });
  });

  document.querySelectorAll('.improve-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      if (couldImprove.has(val)) {
        couldImprove.delete(val);
        btn.className = 'improve-btn text-[13px] font-medium py-[9px] px-[15px] rounded-[100px] border-[1.5px] border-border bg-white text-muted cursor-pointer transition-all font-sans';
      } else {
        couldImprove.add(val);
        btn.className = 'improve-btn text-[13px] font-semibold py-[9px] px-[15px] rounded-[100px] border-[1.5px] border-[#FDE68A] bg-[#FFFBEB] text-[#B45309] cursor-pointer transition-all font-sans';
      }
    });
  });

  const yesBtn = document.getElementById('recYesBtn');
  const noBtn  = document.getElementById('recNoBtn');
  function paintRecButtons(){
    yesBtn.className = 'rec-btn flex items-center justify-center gap-[8px] py-[13px] rounded-[12px] text-[14px] font-semibold cursor-pointer transition-all font-sans ' +
      (recommend === true ? 'border-[1.5px] border-[#BBF7D0] bg-[#F0FDF4] text-[#16A34A]' : 'border-[1.5px] border-border bg-white text-muted');
    noBtn.className = 'rec-btn flex items-center justify-center gap-[8px] py-[13px] rounded-[12px] text-[14px] font-semibold cursor-pointer transition-all font-sans ' +
      (recommend === false ? 'border-[1.5px] border-[#FECACA] bg-[#FEF2F2] text-[#DC2626]' : 'border-[1.5px] border-border bg-white text-muted');
  }
  yesBtn.addEventListener('click', () => { recommend = true; paintRecButtons(); document.getElementById('recError').classList.add('hidden'); });
  noBtn.addEventListener('click', () => { recommend = false; paintRecButtons(); document.getElementById('recError').classList.add('hidden'); });

  let proofFile = null;
  const proofInput = document.getElementById('proofInput');
  const proofPreviewWrap = document.getElementById('proofPreviewWrap');
  const proofPreview = document.getElementById('proofPreview');
  const proofLabel = document.getElementById('proofLabel');
  const proofDropzone = document.getElementById('proofDropzone');

  proofInput.addEventListener('change', () => {
    const file = proofInput.files[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) {
      showToast('Photo is too large — please use one under 8MB');
      proofInput.value = '';
      return;
    }
    proofFile = file;
    proofPreview.src = URL.createObjectURL(file);
    proofPreviewWrap.classList.remove('hidden');
    proofDropzone.classList.add('hidden');
    proofLabel.textContent = file.name;
  });

  document.getElementById('proofRemoveBtn').addEventListener('click', () => {
    proofFile = null;
    proofInput.value = '';
    proofPreviewWrap.classList.add('hidden');
    proofDropzone.classList.remove('hidden');
  });

  document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let hasError = false;
    if (!selectedRating) { document.getElementById('ratingError').classList.remove('hidden'); hasError = true; }
    if (recommend === null) { document.getElementById('recError').classList.remove('hidden'); hasError = true; }
    if (hasError) return;

    const submitBtn = document.getElementById('submitBtn');
    const submitError = document.getElementById('submitError');
    submitError.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = proofFile ? 'Uploading photo…' : 'Submitting…';

    let proofPath = null;
    if (proofFile) {
      const ext = (proofFile.name.split('.').pop() || 'jpg').toLowerCase();
      proofPath = `${doctor.id}/${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await supabase.storage
        .from('review-proofs')
        .upload(proofPath, proofFile, { upsert: false });
      if (uploadError) {
        console.error(uploadError);
        submitError.textContent = 'Could not upload your photo. Please try again.';
        submitError.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit review';
        return;
      }
    }

    submitBtn.textContent = 'Submitting…';

    const payload = {
      doctor_id: doctor.id,
      author: document.getElementById('authorInput').value.trim() || 'Anonymous',
      rating: selectedRating,
      stood_out: [...stoodOut],
      could_improve: [...couldImprove],
      recommend: recommend,
      verified: false,
      proof_photo_path: proofPath,
      proof_status: proofPath ? 'pending' : null,
      proof_submitted_at: proofPath ? new Date().toISOString() : null
    };

    const { error } = await supabase.from('reviews').insert(payload);

    if (error) {
      console.error(error);
      submitError.textContent = 'Something went wrong submitting your review. Please try again.';
      submitError.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit review';
      return;
    }

    showToast(proofPath ? 'Thanks! Your proof is pending review.' : 'Thanks for your review!');
    setTimeout(() => { location.href = `profile.html?id=${doctor.id}`; }, 800);
  });
}

async function init(){
  if (!docId) {
    document.getElementById('pageBody').innerHTML = '<div class="text-center py-[64px]"><p class="font-serif text-[20px] mb-[10px]">No doctor specified</p><a href="searchResult.html" class="text-red text-[14px] hover:underline">← Back to results</a></div>';
    return;
  }
  const doctor = await fetchDoctor(docId);
  if (!doctor) {
    document.getElementById('pageBody').innerHTML = '<div class="text-center py-[64px]"><p class="font-serif text-[20px] mb-[10px]">Doctor not found</p><a href="searchResult.html" class="text-red text-[14px] hover:underline">← Back to results</a></div>';
    return;
  }
  render(doctor);
}
init();
</script>
<script type="module">
    import { supabase } from './js/supabase.js';

    async function updateAuthButton() {
        var btn = document.getElementById('signOutBtn');
        var { data } = await supabase.auth.getSession();

        if (data.session) {
            btn.textContent = 'Sign Out';
            btn.onclick = async function () {
                await supabase.auth.signOut();
                window.location.reload();
            };
        } else {
            btn.textContent = 'Join Waitlist';
            btn.onclick = function () {
                window.location.href = 'auth.html';
            };
        }
    }

    updateAuthButton();
</script>
</body>
</html>
