<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#F8F2ED]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediWay — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/input.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon.png">


</head>
<body class="font-sans text-[#1E293B] min-h-screen bg-[#F8F2ED] antialiased p-0">

<nav class="sticky top-0 z-[200] bg-[#F5F5F4] backdrop-blur-[12px] border-b border-[#E6E6E1] h-[60px] flex items-center px-[16px] sm:px-[24px]">
  <div class="max-w-[900px] w-full mx-auto flex items-center gap-[8px] sm:gap-[12px]">
    <div class="flex items-center gap-[9px] min-w-0">
      <div class="w-[34px] h-[34px] rounded-[10px] bg-[#D0423A] flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </div>
      <span class="font-custom text-[20px] sm:text-[29px] font-bold hover:text-[#D6453A] hover:cursor-pointer text-[#1E293B] truncate">MediWay Admin</span>
    </div>
    <div style="flex:1"></div>
    <button onclick="window.location.href='index.html'" id="homePage" class="text-[13px] text-[#94A3B8] bg-transparent border-none cursor-pointer hover:text-[#1E293B] font-sans whitespace-nowrap shrink-0">Home Page</button>
    <button id="signOutBtn" class="hidden text-[13px] text-[#94A3B8] bg-transparent border-none cursor-pointer hover:text-[#1E293B] font-sans whitespace-nowrap shrink-0">Sign out</button>
  </div>
</nav>

<div class="max-w-[900px] mx-auto px-[16px] sm:px-[24px] py-[28px] sm:py-[36px]" id="pageBody">
  <div class="text-center py-[64px] text-[#94A3B8] text-[14px]" id="loadingState">
    <div class="w-[32px] h-[32px] border-[2px] border-[#E6E6E1] border-t-red rounded-full animate-spin mx-auto mb-[12px]"></div>
    Loading…
  </div>
</div>

<div class="fixed bottom-[24px] left-1/2 -translate-x-1/2 z-[999] bg-[#1E293B] text-white text-[13px] py-[10px] px-[20px] rounded-[10px] opacity-0 pointer-events-none transition-all duration-300" id="toast"></div>

<script type="module">
import { supabase } from './js/supabase.js';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0','pointer-events-none');
  t.classList.add('opacity-100');
  setTimeout(()=>{ t.classList.add('opacity-0','pointer-events-none'); t.classList.remove('opacity-100'); }, 2500);
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starsHtml(r){
  let out='';
  for (let i=1;i<=5;i++) out+=`<span class="text-[13px]" style="color:${i<=r?'#F59E0B':'#D1D5DB'}">★</span>`;
  return out;
}

function renderLogin(mode = 'signin'){
  const isSignup = mode === 'signup';
  document.getElementById('pageBody').innerHTML = `
    <div class="max-w-[380px] mx-auto mt-[40px] sm:mt-[60px] bg-white border border-[#E6E6E1] rounded-[18px] p-[20px] sm:p-[28px]">
      <h1 class="font-serif text-[22px] mb-[4px]">${isSignup ? 'Create admin account' : 'Admin sign in'}</h1>
      <p class="text-[13px] text-[#94A3B8] mb-[20px]">${isSignup ? 'New accounts still need to be approved before they can verify reviews' : 'Verify review proof photos'}</p>
      <form id="loginForm" class="flex flex-col gap-[14px]">
        <input id="emailInput" type="email" placeholder="Email" required class="w-full border-[1.5px] border-[#E6E6E1] rounded-[10px] px-[14px] py-[10px] text-[14px] outline-none focus-within:border-[#D0423A] font-sans"/>
        <input id="passInput" type="password" placeholder="Password" required minlength="6" class="w-full border-[1.5px] border-[#E6E6E1] rounded-[10px] px-[14px] py-[10px] text-[14px] outline-none focus-within:border-[#D0423A] font-sans"/>
        <button type="submit" id="loginBtn" class="bg-[#D0423A] hover:bg-[#B8362F] text-white border-none py-[12px] rounded-[10px] text-[14px] font-semibold cursor-pointer font-sans">${isSignup ? 'Create account' : 'Sign in'}</button>
        <p class="text-[12px] text-[#D0423A] text-center hidden" id="loginError"></p>
        <p class="text-[12px] text-[#94A3B8] text-center hidden" id="loginInfo"></p>
      </form>
      <p class="text-[13px] text-[#94A3B8] text-center mt-[16px]">
        ${isSignup ? 'Already have an account?' : "Don't have an account?"}
        <a href="#" id="modeToggle" class="text-[#D0423A] font-medium">${isSignup ? 'Sign in' : 'Sign up'}</a>
      </p>
    </div>`;

  document.getElementById('modeToggle').addEventListener('click', (e) => {
    e.preventDefault();
    renderLogin(isSignup ? 'signin' : 'signup');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    const info = document.getElementById('loginInfo');
    err.classList.add('hidden');
    info.classList.add('hidden');
    btn.disabled = true; btn.textContent = isSignup ? 'Creating account…' : 'Signing in…';

    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passInput').value;

    if (isSignup) {
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        err.textContent = error.message;
        err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Create account';
        return;
      }
      info.textContent = 'Account created. Ask an existing admin to approve it, then sign in.';
      info.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Create account';
      return;
    }

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      err.textContent = error.message;
      err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }
    await boot();
  });
}

function renderNotAuthorized(){
  document.getElementById('pageBody').innerHTML = `
    <div class="max-w-[420px] mx-auto mt-[40px] sm:mt-[60px] text-center">
      <p class="font-serif text-[22px] mb-[10px]">Not authorized</p>
      <p class="text-[14px] text-[#94A3B8] mb-[20px]">This account isn't on the admin list. Ask whoever manages the database to add your user id to the <code>admins</code> table.</p>
      <button id="signOutBtn2" class="text-[#D0423A] text-[14px] bg-transparent border-none cursor-pointer">Sign out</button>
    </div>`;
  document.getElementById('signOutBtn2').addEventListener('click', async () => { await supabase.auth.signOut(); await boot(); });
}

async function fetchPendingReviews(){
  const { data, error } = await supabase
    .from('reviews')
    .select('*, doctors(name, hospital)')
    .eq('proof_status', 'pending')
    .order('proof_submitted_at', { ascending: true });
  if (error) { console.error(error); return []; }
  return data || [];
}

async function getSignedUrl(path){
  const { data, error } = await supabase.storage.from('review-proofs').createSignedUrl(path, 300);
  if (error) { console.error(error); return null; }
  return data?.signedUrl || null;
}

async function renderQueue(){
  const reviews = await fetchPendingReviews();
  const body = document.getElementById('tabBody');

  if (!reviews.length){
    body.innerHTML = `<div class="text-center py-[64px]"><p class="font-serif text-[22px] mb-[8px]">Queue is empty</p><p class="text-[14px] text-[#94A3B8]">No proof photos waiting on review.</p></div>`;
    return;
  }

  body.innerHTML = `<div class="mb-[20px]"><h1 class="font-serif text-[24px]">Pending verifications</h1><p class="text-[13px] text-[#94A3B8] mt-[3px]">${reviews.length} review${reviews.length===1?'':'s'} awaiting a decision</p></div><div class="flex flex-col gap-[16px]" id="queueList"></div>`;

  const list = document.getElementById('queueList');
  for (const r of reviews){
    const card = document.createElement('div');
    card.className = 'bg-white border border-[#E6E6E1] rounded-[16px] p-[16px] sm:p-[20px] flex flex-col sm:flex-row gap-[16px] sm:gap-[20px]';
    card.innerHTML = `
      <div class="proof-thumb w-full h-[200px] sm:w-[220px] sm:h-[220px] shrink-0 rounded-[10px] bg-[#F2F1ED] flex items-center justify-center overflow-hidden">
        <span class="text-[12px] text-[#94A3B8]">Loading photo…</span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-serif text-[17px] text-[#1E293B]">${escapeHtml(r.doctors?.name || 'Unknown doctor')}</div>
        <div class="text-[12px] text-[#94A3B8] mb-[10px]">${escapeHtml(r.doctors?.hospital || '')}</div>
        <div class="flex items-center gap-[8px] mb-[8px]">
          <span class="text-[13px] font-semibold text-[#1E293B]">${escapeHtml(r.author)}</span>
          ${starsHtml(r.rating)}
        </div>
        ${r.stood_out?.length?`<div class="text-[12px] text-[#3F3F46] mb-[4px]"><strong>Stood out:</strong> ${r.stood_out.map(escapeHtml).join(', ')}</div>`:''}
        ${r.could_improve?.length?`<div class="text-[12px] text-[#3F3F46] mb-[4px]"><strong>Could improve:</strong> ${r.could_improve.map(escapeHtml).join(', ')}</div>`:''}
        <div class="text-[12px] text-[#3F3F46] mb-[14px]"><strong>Recommends:</strong> ${r.recommend ? 'Yes' : 'No'}</div>
        <div class="flex gap-[8px] flex-wrap">
          <button data-action="approve" data-id="${r.id}" class="bg-[#16A34A] hover:bg-[#15803D] text-white border-none px-[16px] py-[9px] rounded-[9px] text-[13px] font-semibold cursor-pointer font-sans">✓ Approve<span class="hidden sm:inline"> — mark verified</span></button>
          <button data-action="reject" data-id="${r.id}" class="bg-white border-[1.5px] border-[#E6E6E1] text-[#3F3F46] px-[16px] py-[9px] rounded-[9px] text-[13px] font-semibold cursor-pointer font-sans hover:border-[#D0423A] hover:text-[#D0423A]">Reject</button>
        </div>
      </div>`;
    list.appendChild(card);

    if (r.proof_photo_path){
      getSignedUrl(r.proof_photo_path).then(url => {
        const imgWrap = card.querySelector('div.proof-thumb');
        imgWrap.innerHTML = url
          ? `<img src="${url}" class="w-full h-full object-cover"/>`
          : `<span class="text-[12px] text-[#94A3B8] px-[10px] text-center">Couldn't load photo</span>`;
      });
    }
  }

  list.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      btn.disabled = true;
      const update = action === 'approve'
        ? { verified: true, proof_status: 'approved' }
        : { proof_status: 'rejected' };
      const { error } = await supabase.from('reviews').update(update).eq('id', id);
      if (error) { console.error(error); showToast('Something went wrong — try again'); btn.disabled = false; return; }
      showToast(action === 'approve' ? 'Marked as verified' : 'Rejected');
      renderQueue();
      refreshTabCounts();
    });
  });
}

// ---------- Tabs ----------

const TAB_CLS = 'tab-btn whitespace-nowrap px-[14px] py-[7px] rounded-[9px] text-[13px] font-semibold border-none cursor-pointer font-sans transition-colors';

function renderShell(){
  document.getElementById('pageBody').innerHTML = `
    <div class="flex gap-[6px] mb-[22px] bg-[#EFEDE8] p-[4px] rounded-[12px] w-fit max-w-full overflow-x-auto">
      <button class="${TAB_CLS}" data-tab="reviews">Review proofs <span class="tab-count opacity-60" data-count="reviews"></span></button>
      <button class="${TAB_CLS}" data-tab="places">Imported places <span class="tab-count opacity-60" data-count="places"></span></button>
      <button class="${TAB_CLS}" data-tab="hours">Hours <span class="tab-count opacity-60" data-count="hours"></span></button>
    </div>
    <div id="tabBody"></div>`;
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  refreshTabCounts();
}

async function showTab(tab){
  sessionStorage.setItem('mw.adminTab', tab);
  document.querySelectorAll('.tab-btn').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('bg-white', on); b.classList.toggle('text-[#1E293B]', on); b.classList.toggle('shadow-sm', on);
    b.classList.toggle('bg-transparent', !on); b.classList.toggle('text-[#94A3B8]', !on);
  });
  document.getElementById('tabBody').innerHTML = `<div class="text-center py-[48px] text-[#94A3B8] text-[14px]">Loading…</div>`;
  if (tab === 'places') await renderPlaces();
  else if (tab === 'hours') await renderHours();
  else await renderQueue();
}

async function refreshTabCounts(){
  const [reviews, places, hours] = await Promise.all([
    supabase.from('reviews').select('id', { count: 'exact', head: true }).eq('proof_status', 'pending'),
    supabase.from('places_staging').select('id', { count: 'exact', head: true }).eq('status', 'pending'),
    needsHours(supabase.from('hospitals').select('id', { count: 'exact', head: true })),
  ]);
  const set = (k, n) => { const el = document.querySelector(`[data-count="${k}"]`); if (el) el.textContent = n ? `(${n})` : ''; };
  set('reviews', reviews.count); set('places', places.count); set('hours', hours.count);
}

// ---------- Imported places ----------
// Rows come from scripts/import-places.mjs. Approve publishes to the site; merge folds a duplicate
// into the existing listing; reject hides it for good. All three go through review_places().

const KIND_COLORS = { hospital: '#D0423A', clinic: '#2563EB', pharmacy: '#16A34A', lab: '#7C3AED' };
const PAGE = 40;
const HIGH_CONFIDENCE = 0.9;
const placesState = { city: null, kind: 'all', offset: 0 };

function sourceLinks(p){
  return (p.sources || []).map(s => s.source === 'osm'
    ? `<a href="https://www.openstreetmap.org/${escapeHtml(s.id)}" target="_blank" rel="noopener" class="underline hover:text-[#1E293B]">OSM</a>`
    : `<span>${escapeHtml(s.source === 'overture' ? 'Overture' : s.source)}</span>`).join(' + ');
}

function placesQuery(select, opts){
  let q = supabase.from('places_staging').select(select, opts)
    .eq('status', 'pending').eq('city', placesState.city);
  if (placesState.kind !== 'all') q = q.eq('kind', placesState.kind);
  return q;
}

async function renderPlaces(){
  const body = document.getElementById('tabBody');
  const { data: cities, error } = await supabase.from('cities').select('slug, name, launched').order('created_at');
  if (error) {
    body.innerHTML = `<div class="text-center py-[48px] text-[14px] text-[#94A3B8]">Couldn't load cities. Have the Supabase migrations been run?</div>`;
    return;
  }
  placesState.city ??= cities[0]?.slug;
  placesState.offset = 0;

  const kinds = ['all', 'hospital', 'clinic', 'pharmacy', 'lab'];
  body.innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-[12px] mb-[16px]">
      <div>
        <h1 class="font-serif text-[24px]">Imported places</h1>
        <p class="text-[13px] text-[#94A3B8] mt-[3px]" id="placesSummary">…</p>
      </div>
      <button id="bulkApprove" class="hidden bg-[#16A34A] hover:bg-[#15803D] text-white border-none px-[14px] py-[9px] rounded-[9px] text-[13px] font-semibold cursor-pointer font-sans"></button>
    </div>
    <div class="flex flex-wrap items-center gap-[8px] mb-[18px]">
      <select id="citySelect" class="border-[1.5px] border-[#E6E6E1] rounded-[9px] px-[10px] py-[7px] text-[13px] bg-white font-sans">
        ${cities.map(c => `<option value="${escapeHtml(c.slug)}" ${c.slug === placesState.city ? 'selected' : ''}>${escapeHtml(c.name)}${c.launched ? '' : ' (not launched)'}</option>`).join('')}
      </select>
      ${kinds.map(k => `<button data-kind="${k}" class="kind-chip px-[11px] py-[6px] rounded-[8px] text-[12px] font-medium border-[1.5px] cursor-pointer font-sans ${k === placesState.kind ? 'border-[#D0423A] bg-[#FDECEA] text-[#D0423A]' : 'border-[#E6E6E1] bg-white text-[#64748B]'}">${k === 'all' ? 'All' : k[0].toUpperCase() + k.slice(1)}</button>`).join('')}
    </div>
    <div class="flex flex-col gap-[10px]" id="placesList"></div>
    <button id="placesMore" class="hidden mt-[14px] w-full py-[10px] rounded-[10px] border-[1.5px] border-dashed border-[#D6D3CC] bg-transparent text-[13px] text-[#64748B] cursor-pointer font-sans hover:border-[#D0423A] hover:text-[#D0423A]">Load more</button>`;

  document.getElementById('citySelect').addEventListener('change', e => { placesState.city = e.target.value; renderPlaces(); });
  document.querySelectorAll('.kind-chip').forEach(b => b.addEventListener('click', () => { placesState.kind = b.dataset.kind; renderPlaces(); }));
  document.getElementById('placesMore').addEventListener('click', () => loadPlacesPage());
  document.getElementById('bulkApprove').addEventListener('click', bulkApprove);

  if (!placesState.city) { document.getElementById('placesSummary').textContent = 'Add a city first.'; return; }
  await Promise.all([loadPlacesPage(), refreshPlacesSummary()]);
}

async function refreshPlacesSummary(){
  const [{ count }, { count: high }] = await Promise.all([
    placesQuery('id', { count: 'exact', head: true }),
    placesQuery('id', { count: 'exact', head: true }).gte('confidence', HIGH_CONFIDENCE),
  ]);
  document.getElementById('placesSummary').textContent = count
    ? `${count} waiting for review · highest confidence first`
    : 'Nothing waiting. Run scripts/import-places.mjs to import a city.';
  const bulk = document.getElementById('bulkApprove');
  bulk.classList.toggle('hidden', !high);
  bulk.textContent = `✓ Accept all ≥ ${HIGH_CONFIDENCE * 100}% (${high})`;
  bulk.dataset.count = high || 0;
}

async function loadPlacesPage(){
  const { data, error } = await placesQuery('*')
    .order('confidence', { ascending: false }).order('id')
    .range(placesState.offset, placesState.offset + PAGE - 1);
  const list = document.getElementById('placesList');
  if (error) { console.error(error); list.insertAdjacentHTML('beforeend', `<p class="text-[13px] text-[#D0423A]">Couldn't load places.</p>`); return; }
  if (!data.length && placesState.offset === 0) {
    list.innerHTML = `<div class="text-center py-[48px]"><p class="font-serif text-[20px] mb-[6px]">Queue is empty</p><p class="text-[13px] text-[#94A3B8]">No imported places waiting for this filter.</p></div>`;
  }

  // Names of the live listings these might duplicate
  const matchIds = [...new Set(data.map(p => p.match_id).filter(Boolean))];
  const matches = {};
  if (matchIds.length) {
    const { data: rows } = await supabase.from('hospitals').select('id, name').in('id', matchIds);
    for (const r of rows || []) matches[r.id] = r.name;
  }

  for (const p of data) list.appendChild(placeCard(p, matches));
  placesState.offset += data.length;
  document.getElementById('placesMore').classList.toggle('hidden', data.length < PAGE);
}

function placeCard(p, matches){
  const color = KIND_COLORS[p.kind] || '#64748B';
  const card = document.createElement('div');
  card.className = 'bg-white border border-[#E6E6E1] rounded-[14px] p-[14px] sm:p-[16px] flex flex-col sm:flex-row sm:items-center gap-[12px]';
  const pct = Math.round(p.confidence * 100);
  card.innerHTML = `
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-[8px] flex-wrap mb-[3px]">
        <span class="text-[10px] font-bold uppercase tracking-[.08em] px-[7px] py-[2px] rounded-[5px]" style="color:${color};background:${color}14">${escapeHtml(p.kind)}</span>
        <span class="text-[11px] font-semibold ${pct >= 90 ? 'text-[#16A34A]' : pct >= 75 ? 'text-[#64748B]' : 'text-[#B45309]'}">${pct}% confident</span>
        <span class="text-[11px] text-[#94A3B8]">${sourceLinks(p)}</span>
      </div>
      <div class="font-serif text-[17px] text-[#1E293B] break-words">${escapeHtml(p.name)}</div>
      <div class="text-[12px] text-[#64748B] mt-[2px] break-words">
        ${escapeHtml(p.address || 'No address')}${p.phone ? ` · ${escapeHtml(p.phone)}` : ''}${p.opening_hours ? ` · ${escapeHtml(p.opening_hours)}` : ''}
        · <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener" class="text-[#D0423A] underline">check on map</a>
      </div>
      ${p.match_id ? `<div class="text-[12px] text-[#B45309] mt-[6px]">Possible duplicate of <strong>${escapeHtml(matches[p.match_id] || p.match_id)}</strong> (already live)</div>` : ''}
    </div>
    <div class="flex gap-[6px] shrink-0">
      ${p.match_id
        ? `<button data-decision="merge" class="bg-[#1E293B] hover:bg-black text-white border-none px-[12px] py-[8px] rounded-[9px] text-[12px] font-semibold cursor-pointer font-sans">Merge</button>
           <button data-decision="approve" class="bg-white border-[1.5px] border-[#E6E6E1] text-[#3F3F46] px-[12px] py-[8px] rounded-[9px] text-[12px] font-semibold cursor-pointer font-sans hover:border-[#16A34A] hover:text-[#16A34A]">Add as new</button>`
        : `<button data-decision="approve" class="bg-[#16A34A] hover:bg-[#15803D] text-white border-none px-[12px] py-[8px] rounded-[9px] text-[12px] font-semibold cursor-pointer font-sans">Approve</button>`}
      <button data-decision="reject" class="bg-white border-[1.5px] border-[#E6E6E1] text-[#3F3F46] px-[12px] py-[8px] rounded-[9px] text-[12px] font-semibold cursor-pointer font-sans hover:border-[#D0423A] hover:text-[#D0423A]">Reject</button>
    </div>`;
  card.querySelectorAll('button[data-decision]').forEach(btn => btn.addEventListener('click', async () => {
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    const ok = await reviewPlaces([p.id], btn.dataset.decision);
    if (!ok) { card.querySelectorAll('button').forEach(b => b.disabled = false); return; }
    card.remove();
    placesState.offset = Math.max(0, placesState.offset - 1);
    showToast({ approve: 'Published', merge: 'Merged into the existing listing', reject: 'Rejected' }[btn.dataset.decision]);
    refreshPlacesSummary(); refreshTabCounts();
  }));
  return card;
}

async function reviewPlaces(ids, decision){
  const { error } = await supabase.rpc('review_places', { place_ids: ids, decision });
  if (error) { console.error(error); showToast(error.message || 'Something went wrong — try again'); return false; }
  return true;
}

// Both sources agreeing is a strong signal: accept those in one go (duplicates are merged, the rest published)
async function bulkApprove(){
  const btn = document.getElementById('bulkApprove');
  if (!confirm(`Accept ${btn.dataset.count} high-confidence places? Possible duplicates are merged into the existing listing; the rest go live.`)) return;
  btn.disabled = true;
  const { data, error } = await placesQuery('id, match_id').gte('confidence', HIGH_CONFIDENCE).limit(1000);
  if (error) { console.error(error); showToast('Could not load places'); btn.disabled = false; return; }
  const merge = data.filter(p => p.match_id).map(p => p.id);
  const approve = data.filter(p => !p.match_id).map(p => p.id);
  const ok = (!merge.length || await reviewPlaces(merge, 'merge')) && (!approve.length || await reviewPlaces(approve, 'approve'));
  btn.disabled = false;
  if (ok) showToast(`Accepted ${data.length} places`);
  refreshTabCounts();
  renderPlaces();
}

// ---------- Hours: phone queue ----------
// Live places with no hours (and hospitals whose 24/7 ER status is unknown), ready to call.
// Saving goes through update_place_hours(); phone-confirmed hours are never overwritten by a script.

const DAY_BUTTONS = [['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 4], ['Fri', 5], ['Sat', 6], ['Sun', 0]];
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6], MON_SAT = [1, 2, 3, 4, 5, 6];
const HOUR_PRESETS = [
  { label: 'Open 24/7', days: ALL_DAYS, ranges: [['00:00', '23:59']] },
  { label: 'Mon–Sat 9 AM–9 PM', days: MON_SAT, ranges: [['09:00', '21:00']] },
  { label: 'Every day 7 AM–8 PM', days: ALL_DAYS, ranges: [['07:00', '20:00']] },
  { label: 'Mon–Sat 10–2 & 5–8', days: MON_SAT, ranges: [['10:00', '14:00'], ['17:00', '20:00']] },
];
const HOURS_PAGE = 20;
const hoursState = { city: null, kind: 'hospital', phoneOnly: true, offset: 0 };
let hoursCities = [];

// No hours yet, or a hospital with unknown ER status — and nobody has confirmed it by phone
function needsHours(q){
  return q.or('schedule.is.null,schedule.eq.[],and(kind.eq.hospital,er24.is.null)')
          .or('hours_source.is.null,hours_source.neq.phone');
}

function hoursQuery(select, opts){
  const city = hoursCities.find(c => c.slug === hoursState.city);
  let q = needsHours(supabase.from('hospitals').select(select, opts))
    .eq('city', city?.name ?? '').eq('kind', hoursState.kind);
  if (hoursState.phoneOnly) q = q.not('phone', 'is', null);
  return q;
}

async function renderHours(){
  const body = document.getElementById('tabBody');
  const { data: cities, error } = await supabase.from('cities').select('slug, name, launched').order('created_at');
  if (error) {
    body.innerHTML = `<div class="text-center py-[48px] text-[14px] text-[#94A3B8]">Couldn't load cities. Have the Supabase migrations been run?</div>`;
    return;
  }
  hoursCities = cities;
  hoursState.city ??= cities[0]?.slug;
  hoursState.offset = 0;

  const kinds = [['hospital', 'Hospitals'], ['pharmacy', 'Pharmacies'], ['clinic', 'Clinics'], ['lab', 'Labs']];
  body.innerHTML = `
    <div class="mb-[16px]">
      <h1 class="font-serif text-[24px]">Opening hours</h1>
      <p class="text-[13px] text-[#94A3B8] mt-[3px]" id="hoursSummary">…</p>
    </div>
    <div class="flex flex-wrap items-center gap-[8px] mb-[18px]">
      <select id="hoursCity" class="border-[1.5px] border-[#E6E6E1] rounded-[9px] px-[10px] py-[7px] text-[13px] bg-white font-sans">
        ${cities.map(c => `<option value="${escapeHtml(c.slug)}" ${c.slug === hoursState.city ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      ${kinds.map(([k, label]) => `<button data-kind="${k}" class="hours-kind px-[11px] py-[6px] rounded-[8px] text-[12px] font-medium border-[1.5px] cursor-pointer font-sans ${k === hoursState.kind ? 'border-[#D0423A] bg-[#FDECEA] text-[#D0423A]' : 'border-[#E6E6E1] bg-white text-[#64748B]'}">${label}</button>`).join('')}
      <label class="flex items-center gap-[6px] text-[12px] text-[#64748B] ml-[4px] cursor-pointer">
        <input type="checkbox" id="hoursPhoneOnly" ${hoursState.phoneOnly ? 'checked' : ''} class="accent-[#D0423A]"> Only places with a phone number
      </label>
    </div>
    <div class="flex flex-col gap-[12px]" id="hoursList"></div>
    <button id="hoursMore" class="hidden mt-[14px] w-full py-[10px] rounded-[10px] border-[1.5px] border-dashed border-[#D6D3CC] bg-transparent text-[13px] text-[#64748B] cursor-pointer font-sans hover:border-[#D0423A] hover:text-[#D0423A]">Load more</button>`;

  document.getElementById('hoursCity').addEventListener('change', e => { hoursState.city = e.target.value; renderHours(); });
  document.querySelectorAll('.hours-kind').forEach(b => b.addEventListener('click', () => { hoursState.kind = b.dataset.kind; renderHours(); }));
  document.getElementById('hoursPhoneOnly').addEventListener('change', e => { hoursState.phoneOnly = e.target.checked; renderHours(); });
  document.getElementById('hoursMore').addEventListener('click', loadHoursPage);
  await Promise.all([loadHoursPage(), refreshHoursSummary()]);
}

async function refreshHoursSummary(){
  const { count } = await hoursQuery('id', { count: 'exact', head: true });
  document.getElementById('hoursSummary').textContent = count
    ? `${count} to call · places nobody has tried come first`
    : 'Nothing left to call for this filter.';
}

async function loadHoursPage(){
  const { data, error } = await hoursQuery('id, name, kind, address, phone, lat, lng, er24, schedule, hours_source, hours_checked_at')
    .order('hours_checked_at', { ascending: true, nullsFirst: true }).order('name')
    .range(hoursState.offset, hoursState.offset + HOURS_PAGE - 1);
  const list = document.getElementById('hoursList');
  if (error) { console.error(error); list.insertAdjacentHTML('beforeend', `<p class="text-[13px] text-[#D0423A]">Couldn't load places. Has 20261003_place_hours.sql been run?</p>`); return; }
  if (!data.length && hoursState.offset === 0) {
    list.innerHTML = `<div class="text-center py-[48px]"><p class="font-serif text-[20px] mb-[6px]">All done here</p><p class="text-[13px] text-[#94A3B8]">Every place in this list has hours.</p></div>`;
  }
  for (const h of data) list.appendChild(hoursCard(h));
  hoursState.offset += data.length;
  document.getElementById('hoursMore').classList.toggle('hidden', data.length < HOURS_PAGE);
}

function hoursCard(h){
  const color = KIND_COLORS[h.kind] || '#64748B';
  const isHospital = h.kind === 'hospital';
  const hasHours = Array.isArray(h.schedule) && h.schedule.length > 0;
  const tried = h.hours_source === 'unreachable' && h.hours_checked_at
    ? `No answer on ${new Date(h.hours_checked_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })}` : '';
  const card = document.createElement('div');
  card.className = 'bg-white border border-[#E6E6E1] rounded-[14px] p-[14px] sm:p-[18px]';
  card.innerHTML = `
    <div class="flex items-start justify-between gap-[10px] flex-wrap">
      <div class="min-w-0">
        <div class="flex items-center gap-[8px] mb-[3px]">
          <span class="text-[10px] font-bold uppercase tracking-[.08em] px-[7px] py-[2px] rounded-[5px]" style="color:${color};background:${color}14">${escapeHtml(h.kind)}</span>
          ${tried ? `<span class="text-[11px] text-[#B45309]">${tried}</span>` : ''}
          ${hasHours ? `<span class="text-[11px] text-[#94A3B8]">Has hours · ER status unknown</span>` : ''}
        </div>
        <div class="font-serif text-[17px] text-[#1E293B] break-words">${escapeHtml(h.name)}</div>
        <div class="text-[12px] text-[#64748B] mt-[2px] break-words">${escapeHtml(h.address || 'No address')} · <a href="https://www.google.com/maps/search/?api=1&query=${h.lat},${h.lng}" target="_blank" rel="noopener" class="text-[#D0423A] underline">map</a></div>
      </div>
      ${h.phone ? `<a href="tel:${escapeHtml(h.phone.replace(/[^\d+]/g, ''))}" class="shrink-0 flex items-center gap-[7px] bg-[#1E293B] hover:bg-black text-white no-underline px-[14px] py-[9px] rounded-[10px] text-[14px] font-semibold">📞 ${escapeHtml(h.phone)}</a>` : `<span class="text-[12px] text-[#94A3B8]">No phone</span>`}
    </div>

    <div class="mt-[14px] pt-[14px] border-t border-[#F0EFEA] ${hasHours ? 'hidden' : ''}" data-hours-editor>
      <div class="flex flex-wrap gap-[6px] mb-[10px]">
        ${HOUR_PRESETS.map((p, i) => `<button type="button" data-preset="${i}" class="px-[10px] py-[6px] rounded-[8px] text-[12px] font-medium border-[1.5px] border-[#E6E6E1] bg-white text-[#3F3F46] cursor-pointer font-sans hover:border-[#1E293B]">${p.label}</button>`).join('')}
      </div>
      <div class="flex flex-wrap items-center gap-[5px] mb-[8px]">
        ${DAY_BUTTONS.map(([label, d]) => `<button type="button" data-day="${d}" aria-pressed="false" class="day-btn w-[42px] py-[6px] rounded-[7px] text-[12px] font-medium border-[1.5px] border-[#E6E6E1] bg-white text-[#64748B] cursor-pointer font-sans">${label}</button>`).join('')}
      </div>
      <div class="flex flex-wrap items-center gap-[8px]" data-ranges>
        ${rangeRow('', '')}
      </div>
      <button type="button" data-add-range class="mt-[6px] text-[12px] text-[#D0423A] bg-transparent border-none cursor-pointer font-sans p-0">+ Add evening session</button>
    </div>

    ${isHospital ? `
    <div class="mt-[12px] flex flex-wrap items-center gap-[6px]">
      <span class="text-[13px] text-[#3F3F46] mr-[4px]">24/7 emergency room?</span>
      ${[['yes', 'Yes'], ['no', 'No'], ['unknown', 'Not sure']].map(([v, l]) => `<button type="button" data-er="${v}" class="er-btn px-[11px] py-[6px] rounded-[8px] text-[12px] font-medium border-[1.5px] cursor-pointer font-sans ${(v === 'yes' && h.er24 === true) || (v === 'no' && h.er24 === false) ? 'border-[#1E293B] bg-[#1E293B] text-white' : 'border-[#E6E6E1] bg-white text-[#64748B]'}">${l}</button>`).join('')}
    </div>` : ''}

    <div class="mt-[14px] flex flex-wrap gap-[8px] items-center">
      <button type="button" data-save class="bg-[#16A34A] hover:bg-[#15803D] text-white border-none px-[16px] py-[9px] rounded-[9px] text-[13px] font-semibold cursor-pointer font-sans">Save</button>
      <button type="button" data-unreachable class="bg-white border-[1.5px] border-[#E6E6E1] text-[#3F3F46] px-[14px] py-[9px] rounded-[9px] text-[13px] font-semibold cursor-pointer font-sans hover:border-[#B45309] hover:text-[#B45309]">No answer</button>
      <button type="button" data-skip class="bg-transparent border-none text-[13px] text-[#94A3B8] cursor-pointer font-sans hover:text-[#1E293B]">Skip</button>
      <span data-error class="text-[12px] text-[#D0423A]"></span>
    </div>`;

  const editor = card.querySelector('[data-hours-editor]');
  const ranges = card.querySelector('[data-ranges]');
  const setDays = days => card.querySelectorAll('.day-btn').forEach(b => {
    const on = days.includes(+b.dataset.day);
    b.setAttribute('aria-pressed', on);
    b.classList.toggle('bg-[#1E293B]', on); b.classList.toggle('text-white', on); b.classList.toggle('border-[#1E293B]', on);
    b.classList.toggle('bg-white', !on); b.classList.toggle('text-[#64748B]', !on); b.classList.toggle('border-[#E6E6E1]', !on);
  });
  const selectedDays = () => [...card.querySelectorAll('.day-btn[aria-pressed="true"]')].map(b => +b.dataset.day).sort();
  const addRange = card.querySelector('[data-add-range]');
  // Two sessions (morning + evening OPD) is the most a day needs here
  const syncAddRange = () => addRange.classList.toggle('hidden', ranges.querySelectorAll('[data-range]').length >= 2);
  const setRanges = list => { ranges.innerHTML = list.map(([o, c], i) => rangeRow(o, c, i > 0)).join(''); syncAddRange(); };

  card.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    const p = HOUR_PRESETS[b.dataset.preset];
    setDays(p.days); setRanges(p.ranges);
  }));
  card.querySelectorAll('.day-btn').forEach(b => b.addEventListener('click', () => {
    const days = new Set(selectedDays());
    days.has(+b.dataset.day) ? days.delete(+b.dataset.day) : days.add(+b.dataset.day);
    setDays([...days]);
  }));
  addRange.addEventListener('click', () => {
    if (ranges.querySelectorAll('[data-range]').length < 2) ranges.insertAdjacentHTML('beforeend', rangeRow('17:00', '20:00', true));
    syncAddRange();
  });
  ranges.addEventListener('click', e => {
    if (e.target.closest('[data-remove-range]')) { e.target.closest('[data-range]').remove(); syncAddRange(); }
  });

  let er = h.er24 === true ? 'yes' : h.er24 === false ? 'no' : null;
  card.querySelectorAll('.er-btn').forEach(b => b.addEventListener('click', () => {
    er = b.dataset.er;
    card.querySelectorAll('.er-btn').forEach(x => {
      const on = x === b;
      x.classList.toggle('bg-[#1E293B]', on); x.classList.toggle('text-white', on); x.classList.toggle('border-[#1E293B]', on);
      x.classList.toggle('bg-white', !on); x.classList.toggle('text-[#64748B]', !on); x.classList.toggle('border-[#E6E6E1]', !on);
    });
  }));

  const showError = msg => { card.querySelector('[data-error]').textContent = msg; };
  const done = msg => {
    card.remove();
    hoursState.offset = Math.max(0, hoursState.offset - 1);
    showToast(msg); refreshHoursSummary(); refreshTabCounts();
  };

  card.querySelector('[data-save]').addEventListener('click', async () => {
    showError('');
    const days = selectedDays();
    const slots = [...ranges.querySelectorAll('[data-range]')].map(r => {
      const [open, close] = [...r.querySelectorAll('input')].map(i => i.value);
      return { open, close };
    }).filter(s => s.open || s.close);
    let schedule = null;
    if (!editor.classList.contains('hidden') && (days.length || slots.length)) {
      if (!days.length) return showError('Pick the days it’s open.');
      if (!slots.length || slots.some(s => !s.open || !s.close)) return showError('Enter opening and closing times.');
      if (slots.some(s => s.close <= s.open)) return showError('Closing time must be after opening time (overnight hours aren’t supported yet).');
      schedule = slots.map(s => ({ days, open: s.open, close: s.close }));
    }
    const hasEr24 = er === 'yes' ? true : er === 'no' ? false : null;
    if (!schedule && !(isHospital && hasEr24 !== null)) {
      return showError(isHospital ? 'Add hours or answer the emergency question.' : 'Add the opening hours, or press “No answer”.');
    }
    const ok = await saveHours(h.id, 'verified', schedule, isHospital ? hasEr24 : null, card);
    if (ok) done(`Saved ${h.name}`);
  });
  card.querySelector('[data-unreachable]').addEventListener('click', async () => {
    if (await saveHours(h.id, 'unreachable', null, null, card)) done('Noted — it’ll come back later in the queue');
  });
  card.querySelector('[data-skip]').addEventListener('click', () => card.remove());
  return card;
}

function rangeRow(open, close, removable = false){
  return `<div data-range class="flex items-center gap-[6px]">
    <input type="time" value="${open}" class="border-[1.5px] border-[#E6E6E1] rounded-[8px] px-[8px] py-[5px] text-[13px] font-sans">
    <span class="text-[12px] text-[#94A3B8]">to</span>
    <input type="time" value="${close}" class="border-[1.5px] border-[#E6E6E1] rounded-[8px] px-[8px] py-[5px] text-[13px] font-sans">
    ${removable ? `<button type="button" data-remove-range class="text-[#94A3B8] bg-transparent border-none cursor-pointer text-[16px] leading-none px-[4px]" title="Remove">×</button>` : ''}
  </div>`;
}

async function saveHours(placeId, outcome, schedule, hasEr24, card){
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  const { error } = await supabase.rpc('update_place_hours', { place_id: placeId, outcome, new_schedule: schedule, has_er24: hasEr24 });
  if (error) {
    console.error(error);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    card.querySelector('[data-error]').textContent = error.message || 'Something went wrong — try again';
    return false;
  }
  return true;
}

async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  const signOutBtn = document.getElementById('signOutBtn');

  if (!session){
    signOutBtn.classList.add('hidden');
    renderLogin();
    return;
  }

  const { data: adminRow } = await supabase.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!adminRow){
    signOutBtn.classList.add('hidden');
    renderNotAuthorized();
    return;
  }

  signOutBtn.classList.remove('hidden');
  renderShell();
  await showTab(sessionStorage.getItem('mw.adminTab') || 'reviews');
}

document.getElementById('signOutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); await boot(); });

boot();
</script>
