<script type="module">
import { supabase } from './js/supabase.js';
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function timeToMins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtTime(t){
  const [h,m]=t.split(':').map(Number);
  const suffix=h<12?'AM':'PM', h12=h%12||12;
  return m===0?`${h12} ${suffix}`:`${h12}:${String(m).padStart(2,'0')} ${suffix}`;
}
function getNowIST(){
  const now=new Date();
  const utcMs=now.getTime()+now.getTimezoneOffset()*60000;
  const ist=new Date(utcMs+330*60000);
  return { day: ist.getDay(), mins: ist.getHours()*60+ist.getMinutes() };
}
function getStatus(doctor){
  const schedule = doctor.schedule || [];
  const { day: today, mins: nowM } = getNowIST();
  for (const slot of schedule){
    if (slot.days.includes(today)){
      const openM=timeToMins(slot.open), closeM=timeToMins(slot.close);
      if (nowM>=openM && nowM<closeM)
        return { open:true, label:`Open · closes ${fmtTime(slot.close)}`, nextSlot:`Today ${fmtTime(slot.open)}` };
    }
  }
  const laterToday = schedule
    .filter(s=>s.days.includes(today) && timeToMins(s.open)>nowM)
    .sort((a,b)=>timeToMins(a.open)-timeToMins(b.open));
  if (laterToday.length){
    const next=laterToday[0];
    return { open:false, label:`Closed · opens ${fmtTime(next.open)}`, nextSlot:`Today ${fmtTime(next.open)}` };
  }
  for (let delta=1; delta<=7; delta++){
    const dayAhead=(today+delta)%7;
    const slotsAhead=schedule
      .filter(s=>s.days.includes(dayAhead))
      .sort((a,b)=>timeToMins(a.open)-timeToMins(b.open));
    if (slotsAhead.length){
      const next=slotsAhead[0];
      const dayLabel = delta===1 ? 'Tomorrow' : DAY_NAMES[dayAhead];
      return { open:false, label:`Closed · opens ${dayLabel} ${fmtTime(next.open)}`, nextSlot:`${dayLabel} ${fmtTime(next.open)}` };
    }
  }
  return { open:false, label:'Closed today', nextSlot:'Check back later' };
}
function scheduleText(doctor){
  const schedule = doctor.schedule || [];
  if (!schedule.length) return 'Timings not listed';
  const groups=[];
  for (const slot of schedule){
    const key=slot.days.join(',');
    const existing=groups.find(g=>g.key===key);
    const range=`${fmtTime(slot.open)} – ${fmtTime(slot.close)}`;
    if (existing) existing.ranges.push(range);
    else groups.push({ key, days:slot.days, ranges:[range] });
  }
  return groups.map(g=>{
    const sorted=[...g.days].sort((a,b)=>a-b);
    let dayStr;
    if (sorted.length===1) dayStr=DAY_NAMES[sorted[0]];
    else {
      const isConsec = sorted.every((d,i)=>i===0||d===sorted[i-1]+1);
      dayStr = isConsec
        ? `${DAY_NAMES[sorted[0]]}–${DAY_NAMES[sorted[sorted.length-1]]}`
        : sorted.map(d=>DAY_NAMES[d]).join(', ');
    }
    return `${dayStr}: ${g.ranges.join(', ')}`;
  }).join(' · ');
}

const USER_LAT = 25.31668000, USER_LNG = 83.01041000;
function dirUrl(d){
  const dest = `${d.hospital || ''} ${d.hospital_address || ''}`.trim();
  return `https://www.google.com/maps/dir/?api=1&origin=${USER_LAT},${USER_LNG}&destination=${encodeURIComponent(dest)}`;
}
function starsHtml(r, sz=14){
  let out='<span class="inline-flex gap-[1px] leading-[1]">';
  for (let i=1;i<=5;i++) out+=`<span style="font-size:${sz}px;color:${i<=Math.round(r)?'#F59E0B':'#D1D5DB'}">★</span>`;
  return out+'</span>';
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}


async function fetchDoctor(id){
  const { data, error } = await supabase
    .from('doctors')
    .select('*')
    .eq('id', id)
    .single();
  if (error) { console.error('fetchDoctor error:', error); return null; }
  return data;
}

async function fetchReviews(id){
  const { data, error } = await supabase
    .from('reviews')
    .select('*')
    .eq('doctor_id', id)
    .order('created_at', { ascending: false });
  if (error) { console.warn('No reviews table, or error fetching reviews:', error.message); return []; }
  return data || [];
}

async function toggleHelpful(btn, reviewId){
  const key = 'helpful_' + reviewId;
  const liked = localStorage.getItem(key) === '1';
  const cnt = btn.querySelector('.hcnt');
  btn.disabled = true;

  const { data, error } = await supabase.rpc(liked ? 'decrement_helpful' : 'increment_helpful', { review_id: reviewId });

  btn.disabled = false;
  if (error) { console.error('helpful vote failed:', error); return; }

  if (liked) { localStorage.removeItem(key); btn.classList.remove('liked'); }
  else { localStorage.setItem(key, '1'); btn.classList.add('liked'); }
  cnt.textContent = data ?? (liked ? Math.max(0, +cnt.textContent - 1) : +cnt.textContent + 1);
}

let currentSort='recent', currentFilter='all', currentDocId=null, allReviews=[];

function fmtReviewDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-US', { month:'short', year:'numeric' });
}

function renderReviews(){
  let revs = allReviews;
  if (currentFilter==='verified') revs = revs.filter(r=>r.verified);
  if (currentFilter==='5') revs = revs.filter(r=>r.rating===5);
  if (currentFilter==='4') revs = revs.filter(r=>r.rating===4);
  if (currentFilter==='low') revs = revs.filter(r=>r.rating<=3);
  if (currentSort==='recent') revs=[...revs].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  if (currentSort==='helpful') revs=[...revs].sort((a,b)=>(b.helpful_count||0)-(a.helpful_count||0));
  if (currentSort==='highest') revs=[...revs].sort((a,b)=>b.rating-a.rating);
  if (currentSort==='lowest') revs=[...revs].sort((a,b)=>a.rating-b.rating);

  const el = document.getElementById('reviewsList');
  if (!el) return;
  if (!revs.length){
    el.innerHTML = '<div class="text-center py-[40px] text-[14px] text-faint">No reviews match this filter.</div>';
    return;
  }
  el.innerHTML = revs.map((r,i)=>`
    <div class="bg-white rounded-[16px] border border-border p-[22px] transition-all duration-200 hover:shadow-[0_4px_20px_rgba(0,0,0,.07)] hover:translate-y-[-1px] animate-fade-up ${r.verified?'border-l-[3px] border-l-red':''}" style="animation-delay:${i*0.05}s">
      <div class="flex items-start justify-between gap-[12px] mb-[14px]">
        <div class="flex items-center gap-[12px]">
          <div class="w-[40px] h-[40px] rounded-full bg-[linear-gradient(135deg,#94A3B8,#64748B)] flex items-center justify-center font-semibold text-[15px] text-white shrink-0">${escapeHtml((r.author||'?').charAt(0))}</div>
          <div>
            <div class="font-semibold text-[14px] text-text flex items-center gap-[6px] flex-wrap">
              ${escapeHtml(r.author)}
              ${r.verified?`<span class="inline-flex items-center gap-[3px] text-[10px] font-semibold bg-[#F0FDF4] border border-[#BBF7D0] text-[#16A34A] py-[2px] px-[7px] rounded-[5px]"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>Visited</span>`:''}
            </div>
            <div class="text-[11px] text-faint mt-[2px]">${escapeHtml(r.origin || '')}${r.origin && r.created_at ? ' · ' : ''}${fmtReviewDate(r.created_at)}</div>
          </div>
        </div>
      ${starsHtml(r.rating,13)}
      </div>
      ${r.recommend !== null && r.recommend !== undefined ? `
        <div class="inline-flex items-center gap-[5px] text-[11px] font-semibold py-[4px] px-[10px] rounded-[6px] mb-[10px] ${r.recommend ? 'bg-[#F0FDF4] text-[#16A34A]' : 'bg-[#FEF2F2] text-[#DC2626]'}">
          ${r.recommend ? '👍 Recommends this doctor' : '👎 Would not recommend'}
        </div>` : ''}
      ${r.title?`<div class="font-semibold text-[14px] text-text mb-[6px]">${escapeHtml(r.title)}</div>`:''}
      ${r.body?`<div class="text-[13px] text-muted leading-[1.65] mb-[4px]">${escapeHtml(r.body)}</div>`:''}
      ${r.stood_out?.length?`
        <div class="mt-[10px]">
          <div class="text-[10px] font-bold tracking-[.06em] uppercase text-[#16A34A] mb-[6px]">Stood out</div>
          <div class="flex flex-wrap gap-[5px]">${r.stood_out.map(t=>`<span class="text-[11px] font-medium py-[3px] px-[10px] rounded-[6px] bg-[#F0FDF4] border border-[#BBF7D0] text-[#16A34A]">${escapeHtml(t)}</span>`).join('')}</div>
        </div>`:''}
      ${r.could_improve?.length?`
        <div class="mt-[10px]">
          <div class="text-[10px] font-bold tracking-[.06em] uppercase text-[#B45309] mb-[6px]">Could improve</div>
          <div class="flex flex-wrap gap-[5px]">${r.could_improve.map(t=>`<span class="text-[11px] font-medium py-[3px] px-[10px] rounded-[6px] bg-[#FFFBEB] border border-[#FDE68A] text-[#B45309]">${escapeHtml(t)}</span>`).join('')}</div>
        </div>`:''}
      ${r.tags?.length?`<div class="flex flex-wrap gap-[5px] mt-[10px]">${r.tags.map(t=>`<span class="text-[11px] font-medium py-[3px] px-[10px] rounded-[6px] bg-[#F2F1ED] border border-border text-faint">${escapeHtml(t)}</span>`).join('')}</div>`:''}
      ${r.visit_date?`<div class="text-[11px] text-faint mt-[8px]">Visited: ${escapeHtml(r.visit_date)}</div>`:''}
      <div class="flex items-center gap-[10px] mt-[14px] pt-[12px] border-t border-border">
        <button class="like-btn flex items-center gap-[5px] text-[12px] text-faint border-[1.5px] border-border rounded-[8px] py-[5px] px-[11px] bg-white cursor-pointer transition-colors duration-150 hover:border-red hover:text-red [&.liked]:text-red [&.liked]:border-[#F5C6C2] [&.liked]:bg-[#FDECEA] ${localStorage.getItem('helpful_'+r.id)==='1'?'liked':''}" onclick="toggleHelpful(this,'${r.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="${localStorage.getItem('helpful_'+r.id)==='1'?'#D0423A':'none'}" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
          Helpful <span class="hcnt">${r.helpful_count||0}</span>
        </button>
        <div class="w-[1px] h-[14px] bg-border"></div>
        <span class="text-[11px] text-faint">${r.verified?'Verified visit':'Unverified'}</span>
      </div>
    </div>`).join('');
}

function setSort(key,btn){
  currentSort=key;
  document.querySelectorAll('.sort-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderReviews();
}
function setFilter(key,btn){
  currentFilter=key;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  renderReviews();
}

function buildProfile(d){
  currentDocId = d.id;
  const total = allReviews.length;
  const avg = total ? (allReviews.reduce((s,r)=>s+r.rating,0)/total).toFixed(1) : '0.0';

  let bd = d.rating_breakdown;
  if (!bd) {
    bd = {5:0,4:0,3:0,2:0,1:0};
    allReviews.forEach(r => { bd[Math.round(r.rating)] = (bd[Math.round(r.rating)]||0)+1; });
  }
  const totalBd = Object.values(bd).reduce((a,b)=>a+b,0) || 1;

  const status = getStatus(d);
  const timings = scheduleText(d);
  const specialtyText = Array.isArray(d.specialty) ? d.specialty.join(', ') : (d.specialty || '');
  const languages = d.languages || [];
  const firstName = (d.name || '').split(' ').slice(1).join(' ');
  const displayRating = total ? avg : '—';
  const displayReviewCount = total;

  document.getElementById('profileContent').innerHTML = `
<div class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-[24px] items-start">
  <div class="flex flex-col gap-[20px] min-w-0">

    <div class="bg-white rounded-[18px] border border-border overflow-hidden">
      <div class="h-[4px] bg-[linear-gradient(90deg,#D0423A_0%,#E87040_60%,#F4A261_100%)]"></div>
      <div class="p-[28px] flex gap-[24px] items-start">
        <div class="relative shrink-0">
          <div class="w-[96px] h-[96px] rounded-[22px] flex items-center justify-center font-serif text-[30px] text-white shadow-[0_0_0_3px_#F5F0EB,0_0_0_5px_rgba(208,66,58,.15)]" style="background:${d.avatar_bg || 'linear-gradient(135deg,#94A3B8,#64748B)'}">${escapeHtml(d.initials || '')}</div>
          ${status.open?'<div class="absolute bottom-[-2px] right-[-2px] w-[20px] h-[20px] rounded-full bg-[#22C55E] border-[3px] border-white"></div>':''}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-[16px] flex-wrap">
            <div>
              ${d.featured?'<div class="inline-block bg-red text-white text-[10px] font-bold tracking-[.08em] uppercase py-[3px] px-[10px] rounded-[6px] mb-[8px]">⭐ Top Pick</div>':''}
              <h1 class="font-serif text-[30px] leading-[1.1] text-text">${escapeHtml(d.name)}</h1>
              <div class="text-[14px] font-semibold text-red mt-[4px]">${escapeHtml(specialtyText)}</div>
              ${d.qualification?`<div class="text-[12px] text-faint mt-[2px]">${escapeHtml(d.qualification)}</div>`:''}
            </div>
            <div class="bg-bg border border-border rounded-[14px] py-[12px] px-[18px] text-center shrink-0 min-w-[110px]">
              <div class="font-serif text-[36px] leading-[1] text-text">${displayRating}</div>
              <div style="margin-top:6px">${starsHtml(+displayRating||0,14)}</div>
              <div class="text-[11px] text-faint mt-[4px]">${displayReviewCount} reviews</div>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-[20px] mt-[20px] pt-[18px] border-t border-border">
            <div class="flex items-center gap-[6px] text-[13px] text-muted">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
              ${escapeHtml(d.hospital || '')} · <strong class="text-text font-semibold">${d.distance_km ?? '—'} km away</strong>
            </div>
            <div class="flex items-center gap-[6px] text-[13px] text-muted">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <strong class="text-text font-semibold">${d.experience ?? '—'} yrs</strong> experience
            </div>
            <div class="flex items-center gap-[6px] text-[13px] text-muted ${status.open?'text-[#16A34A] font-semibold':''}">
              <div class="w-[8px] h-[8px] rounded-full inline-block ${status.open?'bg-[#22C55E]':'bg-faint'}"></div>
              ${status.label}
            </div>
          </div>
          <div class="flex flex-wrap gap-[6px] mt-[14px]">
            ${d.walk_in?`<span class="inline-flex items-center gap-[5px] text-[11px] font-semibold py-[5px] px-[12px] rounded-[100px] bg-[#EFF6FF] border-[1.5px] border-[#BFDBFE] text-[#1D4ED8]"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Walk-ins welcome</span>`:''}
            ${d.insurance?`<span class="inline-flex items-center gap-[5px] text-[11px] font-semibold py-[5px] px-[12px] rounded-[100px] bg-[#EFF6FF] border-[1.5px] border-[#BFDBFE] text-[#1D4ED8]"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Insurance accepted</span>`:''}
            ${languages.map(l=>`<span class="inline-flex items-center gap-[5px] text-[11px] font-medium py-[5px] px-[12px] rounded-[100px] bg-[#F2F1ED] border-[1.5px] border-border text-muted">${escapeHtml(l)}</span>`).join('')}
          </div>
        </div>

    </div>

    ${(d.about || (d.specialties && d.specialties.length)) ? `
    <div class="bg-white rounded-[18px] border border-border overflow-hidden p-[28px]">
      ${d.about?`<div class="text-[10px] font-bold tracking-[.1em] uppercase text-faint mb-[14px]">About</div><p class="text-[14px] text-muted leading-[1.7]">${escapeHtml(d.about)}</p>`:''}

        <div class="flex flex-wrap gap-[8px] mt-[16px]">${d.specialties.map(s=>`<span class="text-[12px] font-medium py-[6px] px-[14px] rounded-[9px] bg-[#F2F1ED] border border-border text-muted cursor-default transition-all duration-150 hover:bg-[#FDECEA] hover:border-[#F3C9C6] hover:text-[#C83930]">${escapeHtml(s)}</span>`).join('')}</div>`:''}
    </div>` : ''}

    <div class="bg-white rounded-[18px] border border-border overflow-hidden p-[28px]">
      <div class="flex items-start justify-between gap-[16px] flex-wrap mb-[24px]">
        <div>
          <h2 class="font-serif text-[22px] text-text">Patient reviews</h2>
          <p class="text-[12px] text-faint mt-[4px]">${total} review${total===1?'':'s'} collected</p>
        </div>
        <a href="review.html?id=${d.id}" class="inline-flex items-center gap-[7px] bg-red text-white text-[13px] font-semibold py-[10px] px-[18px] rounded-[10px] no-underline transition-colors duration-150 hover:bg-red-dark shrink-0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Write a review
        </a>
      </div>
      <div class="flex items-center gap-[40px]">
        <div class="text-center shrink-0">
          <div class="font-serif text-[68px] leading-[1] text-text">${avg}</div>
          <div style="margin-top:8px">${starsHtml(+avg||0,17)}</div>
          <div class="text-[11px] text-faint mt-[8px]">out of 5.0</div>
        </div>
        <div class="flex-1 flex flex-col gap-[9px]">
          ${[5,4,3,2,1].map(n=>`
            <div class="flex items-center gap-[10px]">
              <span class="text-[12px] text-muted w-[10px] text-right shrink-0">${n}</span>
              <span class="text-[13px] text-[#F59E0B] shrink-0">★</span>
              <div class="flex-1 h-[8px] bg-[#F2F1ED] rounded-[100px] overflow-hidden"><div class="h-full rounded-[100px] transition-[width] duration-700 ease-[cubic-bezier(.4,0,.2,1)] ${n>=4?'bg-red':'bg-[#E6C4C1]'}" style="width:${Math.round((bd[n]||0)/totalBd*100)}%"></div></div>
              <span class="text-[12px] text-faint w-[28px] text-right shrink-0">${bd[n]||0}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between flex-wrap gap-[10px]">
      <div class="flex items-center gap-[6px] flex-wrap">
        <span class="text-[12px] text-faint mr-[2px]">Sort:</span>
        <button class="sort-tab active py-[6px] px-[14px] rounded-[8px] text-[12px] font-medium border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-text [&.active]:border-text [&.active]:text-white" onclick="setSort('recent',this)">Recent</button>
        <button class="sort-tab py-[6px] px-[14px] rounded-[8px] text-[12px] font-medium border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-text [&.active]:border-text [&.active]:text-white" onclick="setSort('helpful',this)">Most helpful</button>
        <button class="sort-tab py-[6px] px-[14px] rounded-[8px] text-[12px] font-medium border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-text [&.active]:border-text [&.active]:text-white" onclick="setSort('highest',this)">Highest</button>
        <button class="sort-tab py-[6px] px-[14px] rounded-[8px] text-[12px] font-medium border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-text [&.active]:border-text [&.active]:text-white" onclick="setSort('lowest',this)">Lowest</button>
      </div>
      <div class="flex items-center gap-[6px] flex-wrap">
        <button class="filter-chip active py-[5px] px-[12px] rounded-[100px] text-[12px] border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-[#FDECEA] [&.active]:border-[#F3C9C6] [&.active]:text-red [&.active]:font-semibold" onclick="setFilter('all',this)">All</button>
        <button class="filter-chip py-[5px] px-[12px] rounded-[100px] text-[12px] border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-[#FDECEA] [&.active]:border-[#F3C9C6] [&.active]:text-red [&.active]:font-semibold" onclick="setFilter('verified',this)">✓ Verified</button>
        <button class="filter-chip py-[5px] px-[12px] rounded-[100px] text-[12px] border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-[#FDECEA] [&.active]:border-[#F3C9C6] [&.active]:text-red [&.active]:font-semibold" onclick="setFilter('5',this)">5★ only</button>
        <button class="filter-chip py-[5px] px-[12px] rounded-[100px] text-[12px] border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-[#FDECEA] [&.active]:border-[#F3C9C6] [&.active]:text-red [&.active]:font-semibold" onclick="setFilter('4',this)">4★ only</button>
        <button class="filter-chip py-[5px] px-[12px] rounded-[100px] text-[12px] border-[1.5px] border-border bg-white text-faint cursor-pointer transition-all duration-150 hover:border-[#94A3B8] hover:text-text [&.active]:bg-[#FDECEA] [&.active]:border-[#F3C9C6] [&.active]:text-red [&.active]:font-semibold" onclick="setFilter('low',this)">1–3★</button>
      </div>
    </div>

    <div class="flex flex-col gap-[14px]" id="reviewsList"></div>

  </div>

  <div class="sticky top-[76px] flex flex-col gap-[16px]">

    <div class="bg-white rounded-[18px] border border-border overflow-hidden">
      <div class="p-[20px_22px_16px] border-b border-border">
        <h3 class="font-serif hidden text-[20px] text-text">Book appointment</h3>
        <p class="text-[12px] text-faint mt-[3px]">Confirm your slot in seconds</p>
      </div>
      <div class="p-[20px_22px] flex flex-col gap-[14px]">
        <div class="bg-[#F0FDF4] border border-[#BBF7D0] rounded-[12px] p-[11px_14px] flex items-center justify-between">
          <div class="flex items-center gap-[7px] text-[12px] text-muted font-medium"><div class="w-[7px] h-[7px] rounded-full bg-[#22C55E] shrink-0"></div>Next available</div>
          <div class="text-[13px] font-bold text-[#16A34A]">${status.nextSlot}</div>
        </div>
        ${d.consult_fee != null ? `
        <div class="flex items-center justify-between py-[14px] border-y border-border">
          <span class="text-[12px] text-faint">Consultation fee</span>
          <div class="flex items-baseline gap-[3px]">
            <span class="font-serif text-[26px] text-text">₹${d.consult_fee}</span>
            <span class="text-[11px] text-faint">/ visit</span>
          </div>
        </div>` : ''}
        <button class="w-full  hidden bg-red text-white border-none p-[14px] rounded-[11px] text-[14px] font-semibold cursor-pointer transition-all duration-150 hover:bg-red-dark active:scale-[.98] flex items-center justify-center gap-[7px] font-sans">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Book appointment →
        </button>
        <a href="${dirUrl(d)}" target="_blank" class="w-full bg-white text-text border-[1.5px] border-border p-[12px] rounded-[11px] text-[13px] font-semibold cursor-pointer transition-all duration-150 hover:border-red hover:text-red flex items-center justify-center gap-[7px] no-underline font-sans">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          Get directions
        </a>
      </div>
    </div>

    <div class="bg-white rounded-[18px] border border-border overflow-hidden">
      <div class="p-[22px]">
        <div class="text-[10px] font-bold tracking-[.1em] uppercase text-faint mb-[14px]">Clinic info</div>
        <div class="flex flex-col gap-[16px] mt-[4px]">
          <div class="flex gap-[12px] items-start">
            <div class="w-[36px] h-[36px] rounded-[10px] bg-[#F2F1ED] flex items-center justify-center shrink-0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>
            <div><div class="text-[13px] font-semibold text-text">${escapeHtml(d.hospital || '')}</div><div class="text-[12px] text-faint mt-[2px] leading-[1.5]">${escapeHtml(d.hospital_address || '')}</div></div>
          </div>
          <div class="flex gap-[12px] items-start">
            <div class="w-[36px] h-[36px] rounded-[10px] bg-[#F2F1ED] flex items-center justify-center shrink-0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div><div class="text-[13px] font-semibold text-text">Timings</div><div class="text-[12px] text-faint mt-[2px] leading-[1.5]">${escapeHtml(timings)}</div></div>
          </div>
          <div class="flex gap-[12px] items-start">
            <div class="w-[36px] h-[36px] rounded-[10px] bg-[#F2F1ED] flex items-center justify-center shrink-0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
            <div>
              <div class="text-[13px] font-semibold text-text">Languages</div>
              <div class="flex flex-wrap gap-[5px] mt-[6px]">${languages.map(l=>`<span class="text-[11px] font-medium py-[3px] px-[9px] rounded-[6px] bg-[#F2F1ED] border border-border text-muted">${escapeHtml(l)}</span>`).join('')}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="rounded-[18px] overflow-hidden bg-[#1a1a1a] p-[22px]">
      <div class="w-[40px] h-[40px] rounded-[10px] bg-[rgba(255,255,255,.1)] flex items-center justify-center mb-[16px]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div class="font-serif text-[17px] text-white mb-[6px]">Visited ${escapeHtml(firstName)}?</div>
      <div class="text-[12px] text-[rgba(255,255,255,.45)] mb-[16px] leading-[1.55]">Your review helps other patients find the right care.</div>
      <a href="review.html?id=${d.id}" class="flex items-center justify-center gap-[7px] bg-red text-white text-[13px] font-semibold py-[11px] rounded-[10px] no-underline transition-colors duration-150 hover:bg-red-dark font-sans">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Write a review
      </a>
    </div>

  </div>
</div>`;

  document.getElementById('ctaBar').style.display = 'block';
  document.getElementById('ctaName').textContent = d.name;
  document.getElementById('ctaSpec').textContent = `${specialtyText} · ${d.hospital || ''}`;
  document.getElementById('ctaDir').onclick = () => window.open(dirUrl(d), '_blank');

  renderReviews();
}

async function init(){
  const params = new URLSearchParams(location.search);
  const docId = params.get('id');

  if (!docId) {
    document.getElementById('profileContent').innerHTML =
      '<div class="text-center py-[64px]"><p class="font-serif text-[22px] mb-[12px]">No doctor specified</p><a href="searchResult.html" class="text-red text-[14px] hover:underline">← Back to results</a></div>';
    return;
  }

  const doctor = await fetchDoctor(docId);
  if (!doctor) {
    document.getElementById('profileContent').innerHTML =
      '<div class="text-center py-[64px]"><p class="font-serif text-[22px] mb-[12px]">Doctor not found</p><a href="searchResult.html" class="text-red text-[14px] hover:underline">← Back to results</a></div>';
    return;
  }

  allReviews = await fetchReviews(docId);

  document.title = `MediWay — ${doctor.name}`;
  buildProfile(doctor);
}

window.toggleHelpful = toggleHelpful;
window.setSort = setSort;
window.setFilter = setFilter;

init();
</script>
<script type="module">
    import { supabase } from './js/supabase.js';

    async function updateAuthButton() {
        var btn = document.getElementById('signOutBtn');
        var { data } = await supabase.auth.getSession();

        if (data.session) {
            btn.textContent = 'Sign Out';
            btn.onclick = async function () {
                await supabase.auth.signOut();
                window.location.reload();
            };
        } else {
            btn.textContent = 'Join Waitlist';
            btn.onclick = function () {
                window.location.href = 'auth.html';
            };
        }
    }

    updateAuthButton();
</script>
</body>
</html>
