[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_* values are meant to ship in the browser bundle (Vite inlines them):
  # the Supabase anon key is protected by Row Level Security, the Mappls key by its
  # domain whitelist. Tell Netlify's secrets scanner they are expected there.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_MAPPLS_KEY"

# Addresses from the multi-page site (bookmarks, shared links, Supabase invite emails) move to
# their clean URLs. Query strings carry over; browsers keep the #hash. src/router.jsx does the same.
[[redirects]]
  from = "/searchResult.html"
  to = "/search"
  status = 301

[[redirects]]
  from = "/profile.html"
  to = "/profile"
  status = 301

[[redirects]]
  from = "/review.html"
  to = "/review"
  status = 301

[[redirects]]
  from = "/auth.html"
  to = "/auth"
  status = 301

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301

# Single-page app: the app's own routes are served by React Router (status 200). Pre-rendered pages
# (scripts/prerender.mjs, e.g. /varanasi/hospitals.html, /doctor/12.html) are real files and win over these.
# Keep this list in step with src/router.jsx.

[[redirects]]
  from = "/search"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/emergency"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/review"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/doctor/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/hospitals"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/clinics"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/pharmacies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/labs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/doctors"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:city/emergency"
  to = "/index.html"
  status = 200

# Everything else: the app's "Page not found" page, with a real 404 status for browsers and search engines
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
